name: Build and Release Nim Executables

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: acc-linux
          - os: macos-latest
            artifact_name: acc-osx-arm64
          - os: macos-15-intel
            artifact_name: acc-osx-x86
          - os: windows-latest
            artifact_name: acc-windows.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache Nim
        uses: actions/cache@v4
        with:
          path: ~/.choosenim
          key: ${{ runner.os }}-${{ matrix.os }}-nim-${{ hashFiles('**/nim.cfg') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.os }}-nim-

      - name: Cache Nimble
        uses: actions/cache@v4
        with:
          path: ~/.nimble
          key: ${{ runner.os }}-${{ matrix.os }}-nimble-${{ hashFiles('**/*.nimble') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.os }}-nimble-

      - name: Cache Homebrew (macOS)
        if: startsWith(matrix.os, 'macos')
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-${{ matrix.os }}-homebrew
          restore-keys: |
            ${{ runner.os }}-${{ matrix.os }}-homebrew-

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.0.6"

      - name: Install dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew update
          brew install pcre

      # Resolved once, and the job fails here if the static library is
      # absent. Linking -lpcre instead would bake an absolute Homebrew path
      # into the binary, which is worse than the dlopen it replaces: it would
      # not start at all off the build machine.
      - name: Locate the static pcre (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          PCRE_A="$(pcre-config --prefix)/lib/libpcre.a"
          if [ ! -f "$PCRE_A" ]; then
            echo "No static libpcre at: $PCRE_A"
            exit 1
          fi
          # One --passC per include flag, so a prefix needing none
          # contributes nothing and a multi-flag one does not get split.
          # A bare --passC: is not inert: Nim reads the next argument as its
          # value, which puts the link flag on the compile line.
          PCRE_FLAGS="-d:usePcreHeader --passL:$PCRE_A"
          for flag in $(pcre-config --cflags); do
            PCRE_FLAGS="$PCRE_FLAGS --passC:$flag"
          done
          echo "PCRE_FLAGS=$PCRE_FLAGS" >> "$GITHUB_ENV"

      # Built from source with the gcc Nim compiles with. Ubuntu 26.04 no
      # longer packages pcre1, and on Windows MSYS2's archive is made by
      # another toolchain and expects its runtime; without one the exe looks
      # for pcre64.dll at startup and exits when it is not there. -static
      # keeps the MinGW runtime DLLs out as well, but not glibc on Linux.
      - name: Build the static pcre (Linux, Windows)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            PCRE_DIR="$(cygpath -m "$RUNNER_TEMP")/pcre-8.45"
          else
            PCRE_DIR="$RUNNER_TEMP/pcre-8.45"
          fi
          cd "$RUNNER_TEMP"
          curl -sSfL -o pcre.tar.bz2 \
            https://downloads.sourceforge.net/project/pcre/pcre/8.45/pcre-8.45.tar.bz2
          echo "4dae6fdcd2bb0bb6c37b5f97c33c2be954da743985369cddac3546e3218bffb8  pcre.tar.bz2" \
            | sha256sum -c -
          tar xjf pcre.tar.bz2
          cd pcre-8.45
          cp pcre.h.generic pcre.h
          cp config.h.generic config.h
          cp pcre_chartables.c.dist pcre_chartables.c
          for source in byte_order chartables compile config dfa_exec exec \
                        fullinfo get globals jit_compile maketables newline \
                        ord2utf8 refcount string_utils study tables ucd \
                        valid_utf8 version xclass; do
            gcc -O2 -c -DHAVE_CONFIG_H -DPCRE_STATIC -DSUPPORT_UTF -DSUPPORT_UCP \
              -I. "pcre_$source.c" -o "pcre_$source.o"
          done
          ar rcs libpcre.a pcre_*.o
          PCRE_FLAGS="-d:usePcreHeader --passL:$PCRE_DIR/libpcre.a --passC:-I$PCRE_DIR"
          PCRE_FLAGS="$PCRE_FLAGS --passC:-DPCRE_STATIC"
          if [ "${{ runner.os }}" = "Windows" ]; then
            PCRE_FLAGS="$PCRE_FLAGS --passL:-static"
          fi
          echo "PCRE_FLAGS=$PCRE_FLAGS" >> "$GITHUB_ENV"

      - name: Install Nim dependencies (macOS)
        if: runner.os == 'macOS'
        run: nimble install -y

      # gcc 14 and later reject the pointer casts in docopt's generated C.
      - name: Install Nim dependencies (Linux, Windows)
        if: runner.os != 'macOS'
        run: nimble install -y --passC:-Wno-incompatible-pointer-types

      - name: Build executable (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          nimble build -p:src --threads:on --mm:orc --deepcopy:on -d:release --passC:-Wno-incompatible-pointer-types $PCRE_FLAGS

      - name: Build executable (macOS ARM64)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          nimble build -p:src --threads:on --mm:orc --deepcopy:on -d:release --cpu:arm64 $PCRE_FLAGS

      - name: Build executable (macOS x86)
        if: matrix.os == 'macos-15-intel'
        shell: bash
        run: |
          nimble build -p:src --threads:on --mm:orc --deepcopy:on -d:release --cpu:amd64 $PCRE_FLAGS

      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          nimble build -p:src --threads:on --mm:orc --deepcopy:on -d:release --passC:-Wno-incompatible-pointer-types $PCRE_FLAGS

      # pcre loaded through LoadLibrary would not show up here; the smoke
      # build below is what catches that.
      - name: Check the exe imports only system DLLs (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          objdump -p ./acc.exe | grep "DLL Name" | tee dlls.txt
          if grep -iE "pcre|libwinpthread|libgcc|libstdc" dlls.txt; then
            echo "acc.exe depends on a DLL that is not shipped with it"
            exit 1
          fi

      - name: Test path and condition handling (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for suite in src/portable_path.nim src/workflow_condition.nim \
                       src/page_context.nim test/render_paths.nim \
                       test/path_router_spec.nim test/change_sets.nim; do
            nim c -r --hints:off -p:src --threads:on --mm:orc --deepcopy:on \
              --passC:-Wno-incompatible-pointer-types $PCRE_FLAGS "$suite"
          done

      - name: Build the smoke site
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            test/smoke_site.sh ./acc.exe
          else
            test/smoke_site.sh ./acc
          fi

      # Renamed before upload, not merely placed in a per-platform directory:
      # a GitHub release is a flat namespace, so three artifacts all called
      # `acc` collide there. The release action keeps one and appends a
      # content hash to the rest, which is where assets like
      # acc-48d984d64309c7b2ae31626e3c4f8659 in v0.2.2 came from — nobody
      # downloading can tell which platform they are for.
      - name: Name the binary for its platform
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv ./acc.exe ./${{ matrix.artifact_name }}
          else
            mv ./acc ./${{ matrix.artifact_name }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ./${{ matrix.artifact_name }}

  # Any branch builds and smoke-tests, and its binaries can be downloaded
  # from the run; only development and tags publish a release.
  create-release:
    needs: build
    if: github.ref == 'refs/heads/development' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read version from nimble file
        id: get_version
        run: |
          VERSION=$(grep 'version =' acc.nimble | awk -F '"' '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Prepare release
        id: prepare_release
        run: |
          if [[ ${{ github.ref }} == refs/tags/* ]]; then
            echo "IS_RELEASE=true" >> $GITHUB_OUTPUT
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=Release ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          else
            echo "IS_RELEASE=false" >> $GITHUB_OUTPUT
            echo "TAG_NAME=v${{ steps.get_version.outputs.VERSION }}-dev" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=Development build v${{ steps.get_version.outputs.VERSION }}" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: "${{ steps.prepare_release.outputs.IS_PRERELEASE }}"
          automatic_release_tag: "${{ steps.prepare_release.outputs.TAG_NAME }}"
          title: "${{ steps.prepare_release.outputs.RELEASE_NAME }}"
          files: |
            ./acc-linux/acc-linux
            ./acc-osx-arm64/acc-osx-arm64
            ./acc-osx-x86/acc-osx-x86
            ./acc-windows.exe/acc-windows.exe
